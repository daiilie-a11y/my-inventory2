<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>卡其典雅版多層級庫存管理系統 (雲端同步版)</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        khaki: {
                            50: '#FAF8F5',
                            100: '#F4EFEA',
                            200: '#E6E1DA',
                            300: '#D5C9BD',
                            400: '#B8977E',
                            500: '#A68065',
                            600: '#8C674E',
                            700: '#6E4E3A',
                            800: '#523A2B',
                            900: '#3A2918',
                        },
                        warm: {
                            bg: '#FAF8F5',
                            card: '#FFFFFF',
                            text: '#3A322C',
                            muted: '#8C827A',
                            border: '#E8E3D0',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF8F5;
            color: #3A322C;
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .round-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .round-checkbox:checked {
            background-color: #FFFFFF;
            border-color: #FFFFFF;
        }
        .round-checkbox:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 5px;
            height: 10px;
            border-bottom: 2px solid #A68065;
            border-right: 2px solid #A68065;
            margin-top: -1px;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        .folder-card-bg {
            background: linear-gradient(135deg, #B8977E 0%, #8C674E 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased pb-24">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-warm-border sticky top-0 z-30 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-khaki-400 to-khaki-600 flex items-center justify-center text-white shadow-sm">
                    <i class="fa-solid fa-boxes-stacked text-sm"></i>
                </div>
                <h1 id="app-title" class="font-bold text-warm-text text-base tracking-tight">雲端庫存系統</h1>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- 雲端登入狀態按鈕 -->
                <button onclick="toggleCloudLoginModal()" id="cloud-status-btn" class="px-3 py-1.5 bg-khaki-100 hover:bg-khaki-200 text-khaki-800 text-xs font-medium rounded-lg transition-all flex items-center gap-1.5 border border-khaki-300">
                    <i class="fa-solid fa-cloud text-khaki-600"></i>
                    <span id="cloud-status-text">訪客模式 (本機)</span>
                </button>
                <button onclick="openFolderModal()" class="w-8 h-8 rounded-xl border border-warm-border hover:bg-khaki-100 transition-all flex items-center justify-center text-khaki-700">
                    <i class="fa-solid fa-folder-plus text-sm"></i>
                </button>
                <button onclick="openItemModal()" class="px-3.5 py-1.5 h-8 rounded-xl bg-khaki-700 hover:bg-khaki-800 text-white text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>新增商品</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-4xl mx-auto px-4 py-4 flex-1 w-full space-y-4">
        
        <!-- 麵包屑導航與同步提示 -->
        <div class="flex items-center justify-between bg-white px-4 py-2.5 rounded-2xl border border-warm-border shadow-xs">
            <nav id="breadcrumbs" class="flex items-center text-xs font-medium text-warm-muted overflow-x-auto whitespace-nowrap py-1">
                <!-- 動態生成 -->
            </nav>
            <div id="sync-indicator" class="text-[10px] text-emerald-600 font-medium hidden items-center gap-1 bg-emerald-50 px-2 py-0.5 rounded-full">
                <i class="fa-solid fa-circle-check"></i> 雲端已同步
            </div>
        </div>

        <!-- 搜尋列 -->
        <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-warm-muted">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </span>
            <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="搜尋目前層級的商品名稱..." class="w-full pl-9 pr-4 py-2.5 bg-white border border-warm-border rounded-2xl text-xs text-warm-text focus:outline-none focus:border-khaki-500 shadow-xs transition-all">
        </div>

        <!-- 資料夾網格區 -->
        <section>
            <div class="flex items-center justify-between mb-2 px-1">
                <h2 class="text-xs font-bold text-warm-muted uppercase tracking-wider">資料夾分類</h2>
                <span id="folder-count-label" class="text-[10px] text-warm-muted">0 個資料夾</span>
            </div>
            <div id="folder-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <!-- 動態渲染 -->
            </div>
        </section>

        <!-- 商品清單表格區 -->
        <section class="bg-white rounded-2xl border border-warm-border shadow-xs overflow-hidden">
            <div class="px-4 py-3 border-b border-warm-border flex items-center justify-between bg-khaki-50/50">
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this)" class="rounded text-khaki-600 focus:ring-khaki-500 w-4 h-4 border-warm-border">
                    <span class="text-xs font-bold text-warm-text">商品庫存列表</span>
                </div>
                <span id="item-count-label" class="text-[10px] text-warm-muted">共 0 項商品</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse table-fixed">
                    <colgroup>
                        <col style="width: 36px;">
                        <col style="width: 48px;">
                        <col style="width: auto;">
                        <col style="width: 105px;">
                        <col style="width: 40px;">
                    </colgroup>
                    <thead>
                        <tr class="border-b border-warm-border text-[11px] text-warm-muted bg-warm-bg/50">
                            <th class="py-2.5 px-1 text-center"></th>
                            <th class="py-2.5 px-1 text-center font-medium">圖片</th>
                            <th class="py-2.5 px-2 font-medium">商品名稱與備註</th>
                            <th class="py-2.5 px-1 text-center font-medium">數量</th>
                            <th class="py-2.5 px-1 text-center font-medium"></th>
                        </tr>
                    </thead>
                    <tbody id="item-table-body" class="divide-y divide-warm-border text-xs">
                        <!-- 動態渲染 -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- 底部批次操作浮動列 -->
    <div id="batch-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-khaki-900/95 backdrop-blur-md text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-4 z-40 hidden transition-all translate-y-10 opacity-0">
        <span id="batch-count-text" class="text-xs font-medium">已選擇 0 項</span>
        <div class="h-4 w-[1px] bg-white/20"></div>
        <button onclick="openBatchMoveModal()" class="text-xs font-bold hover:text-khaki-200 transition-colors flex items-center gap-1.5">
            <i class="fa-solid fa-folder-arrow-right"></i> 移動
        </button>
        <button onclick="batchDeleteItems()" class="text-xs font-bold text-red-300 hover:text-red-200 transition-colors flex items-center gap-1.5">
            <i class="fa-solid fa-trash-can"></i> 刪除
        </button>
    </div>

    <!-- 雲端帳號登入/狀態 Modal -->
    <div id="cloud-login-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-warm-border space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-warm-text text-base flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-khaki-600"></i> 雲端同步管理
                </h3>
                <button onclick="toggleCloudLoginModal()" class="w-8 h-8 rounded-full hover:bg-khaki-50 flex items-center justify-center text-warm-muted">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-xs text-warm-muted leading-relaxed">
                目前系統支援**免登入本機模式**與**雲端帳號同步**。登入後您的資料將安全保存於雲端，換手機也不怕遺失！
            </p>
            <div id="auth-user-info" class="p-3 bg-khaki-50 rounded-2xl border border-warm-border text-xs space-y-1 hidden">
                <div class="font-bold text-warm-text" id="auth-user-email">user@example.com</div>
                <div class="text-[10px] text-emerald-600">狀態：已連線至雲端資料庫</div>
            </div>
            <div class="space-y-2 pt-2">
                <button id="login-google-btn" onclick="loginWithGoogle()" class="w-full py-2.5 bg-khaki-700 hover:bg-khaki-800 text-white rounded-xl text-xs font-bold transition-all shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-brands fa-google"></i> 使用 Google 帳號登入/同步
                </button>
                <button id="logout-btn" onclick="logoutCloud()" class="w-full py-2 bg-warm-bg hover:bg-khaki-100 text-warm-text rounded-xl text-xs font-medium transition-all hidden">
                    登出雲端並切回訪客模式
                </button>
            </div>
        </div>
    </div>

    <!-- 新增/編輯資料夾 Modal -->
    <div id="folder-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-warm-border space-y-4">
            <h3 id="folder-modal-title" class="font-bold text-warm-text text-base">新增資料夾</h3>
            <input type="hidden" id="edit-folder-id">
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-warm-muted">資料夾名稱</label>
                <input type="text" id="folder-name-input" placeholder="例如：上衣、下裝..." class="w-full px-3.5 py-2.5 bg-warm-bg border border-warm-border rounded-xl text-xs text-warm-text focus:outline-none focus:border-khaki-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeFolderModal()" class="flex-1 py-2.5 bg-warm-bg hover:bg-khaki-100 text-warm-text rounded-xl text-xs font-medium transition-all">取消</button>
                <button onclick="saveFolder()" class="flex-1 py-2.5 bg-khaki-700 hover:bg-khaki-800 text-white rounded-xl text-xs font-bold transition-all shadow-sm">儲存</button>
            </div>
        </div>
    </div>

    <!-- 新增/編輯商品 Modal -->
    <div id="item-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-warm-border space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 id="item-modal-title" class="font-bold text-warm-text text-base">新增商品</h3>
            <input type="hidden" id="edit-item-id">
            
            <div class="space-y-3">
                <!-- 圖片上傳 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-warm-muted">商品圖片</label>
                    <div class="flex items-center gap-3">
                        <div id="image-preview-box" class="w-16 h-16 rounded-2xl border border-warm-border bg-warm-bg flex items-center justify-center overflow-hidden text-warm-muted">
                            <i class="fa-solid fa-image text-lg"></i>
                        </div>
                        <input type="file" id="item-image-input" accept="image/*" onchange="previewImage(this)" class="text-xs text-warm-muted file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-khaki-100 file:text-khaki-800 hover:file:bg-khaki-200 cursor-pointer">
                    </div>
                </div>

                <!-- 商品名稱 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-warm-muted">商品名稱與文字</label>
                    <input type="text" id="item-name-input" placeholder="請輸入商品名稱..." class="w-full px-3.5 py-2.5 bg-warm-bg border border-warm-border rounded-xl text-xs text-warm-text focus:outline-none focus:border-khaki-500">
                </div>

                <!-- 數量 -->
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-warm-muted">初始庫存數量</label>
                    <input type="number" id="item-qty-input" value="1" min="0" class="w-full px-3.5 py-2.5 bg-warm-bg border border-warm-border rounded-xl text-xs text-warm-text focus:outline-none focus:border-khaki-500">
                </div>

                <!-- 樣式設定：字體粗細、顏色、格子背景 -->
                <div class="grid grid-cols-3 gap-2 pt-1">
                    <div class="space-y-1">
                        <label class="text-[11px] font-medium text-warm-muted">字體粗細</label>
                        <select id="item-font-weight" class="w-full p-2 bg-warm-bg border border-warm-border rounded-xl text-xs text-warm-text">
                            <option value="normal">正常</option>
                            <option value="500">中等</option>
                            <option value="bold" selected>粗體</option>
                            <option value="900">特粗</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] font-medium text-warm-muted">文字顏色</label>
                        <input type="color" id="item-text-color" value="#3A322C" class="w-full h-9 p-1 bg-warm-bg border border-warm-border rounded-xl cursor-pointer">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] font-medium text-warm-muted">表格格子顏色</label>
                        <input type="color" id="item-bg-color" value="#FFFFFF" class="w-full h-9 p-1 bg-warm-bg border border-warm-border rounded-xl cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="flex gap-2 pt-3">
                <button onclick="closeItemModal()" class="flex-1 py-2.5 bg-warm-bg hover:bg-khaki-100 text-warm-text rounded-xl text-xs font-medium transition-all">取消</button>
                <button onclick="saveItem()" class="flex-1 py-2.5 bg-khaki-700 hover:bg-khaki-800 text-white rounded-xl text-xs font-bold transition-all shadow-sm">儲存商品</button>
            </div>
        </div>
    </div>

    <!-- 移動至資料夾 Modal (具備字體放大與快速新增) -->
    <div id="move-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-warm-border space-y-4">
            <h3 class="font-bold text-warm-text text-base flex items-center gap-2">
                <i class="fa-solid fa-folder-arrow-right text-khaki-600"></i> 移動至資料夾
            </h3>
            <p class="text-xs text-warm-muted">請選擇目標資料夾（點選後即完成移動）。</p>
            
            <!-- 快速新增資料夾區塊 -->
            <div class="p-3 bg-khaki-50 rounded-2xl border border-warm-border space-y-2">
                <div class="text-xs font-bold text-khaki-900">快速新增子資料夾</div>
                <div class="flex gap-2">
                    <input type="text" id="quick-subfolder-name" placeholder="輸入新資料夾名稱..." class="flex-1 px-3 py-1.5 bg-white border border-warm-border rounded-xl text-xs focus:outline-none focus:border-khaki-500">
                    <button onclick="quickCreateFolderInMove()" class="px-3 py-1.5 bg-khaki-700 hover:bg-khaki-800 text-white text-xs font-bold rounded-xl transition-all">新增</button>
                </div>
            </div>

            <!-- 樹狀目錄 (字體放大 1.5 倍) -->
            <div id="move-folder-tree" class="max-h-52 overflow-y-auto p-3 bg-warm-bg rounded-2xl border border-warm-border space-y-1.5 text-base font-medium">
                <!-- 動態生成 -->
            </div>

            <div class="flex justify-end pt-1">
                <button onclick="closeMoveModal()" class="px-4 py-2 bg-warm-bg hover:bg-khaki-100 text-warm-text rounded-xl text-xs font-medium transition-all">關閉</button>
            </div>
        </div>
    </div>

    <!-- 核心 JavaScript 邏輯 -->
    <script>
        // 資料結構與狀態
        let folders = JSON.parse(localStorage.getItem('inv_folders')) || [];
        let items = JSON.parse(localStorage.getItem('inv_items')) || [];
        let currentFolderId = null; // null 代表主目錄 (Root)
        let searchQuery = '';
        let selectedItemIds = new Set();
        let targetItemForMove = null; // 用於單項移動或批次移動

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });

        // 儲存至 localStorage
        function saveData() {
            localStorage.setItem('inv_folders', JSON.stringify(folders));
            localStorage.setItem('inv_items', JSON.stringify(items));
            renderApp();
        }

        // 渲染整體介面
        function renderApp() {
            renderBreadcrumbs();
            renderFolderGrid();
            renderItemTable();
            updateBatchBar();
        }

        // 1. 麵包屑導航
        function renderBreadcrumbs() {
            const nav = document.getElementById('breadcrumbs');
            let html = `<button onclick="navigateToFolder(null)" class="hover:text-khaki-700 transition-colors flex items-center gap-1 font-bold"><i class="fa-solid fa-house"></i> 主目錄</button>`;
            
            if (currentFolderId) {
                let path = [];
                let curr = folders.find(f => f.id === currentFolderId);
                while (curr) {
                    path.unshift(curr);
                    curr = folders.find(f => f.id === curr.parentId);
                }
                path.forEach(f => {
                    html += `<span class="mx-1.5 text-warm-muted">/</span><button onclick="navigateToFolder('${f.id}')" class="hover:text-khaki-700 transition-colors font-bold">${f.name}</button>`;
                });
            }
            nav.innerHTML = html;
        }

        function navigateToFolder(folderId) {
            currentFolderId = folderId;
            selectedItemIds.clear();
            document.getElementById('select-all-checkbox').checked = false;
            document.getElementById('search-input').value = '';
            searchQuery = '';
            renderApp();
        }

        // 2. 資料夾網格渲染
        function renderFolderGrid() {
            const grid = document.getElementById('folder-grid');
            const subFolders = folders.filter(f => f.parentId === currentFolderId);
            document.getElementById('folder-count-label.innerText') = `${subFolders.length} 個資料夾`;
            
            if (subFolders.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-4 text-center text-xs text-warm-muted bg-white rounded-2xl border border-warm-border">此目錄尚無子資料夾，可點擊右上角新增</div>`;
                return;
            }

            let html = '';
            subFolders.forEach(f => {
                const itemCount = items.filter(i => i.folderId === f.id).length;
                html += `
                    <div onclick="navigateToFolder('${f.id}')" class="bg-white p-3 rounded-2xl border border-warm-border hover:border-khaki-400 transition-all cursor-pointer shadow-xs flex items-center justify-between group">
                        <div class="flex items-center gap-2.5 truncate">
                            <div class="w-9 h-9 rounded-xl folder-card-bg flex items-center justify-center text-white shrink-0 shadow-xs">
                                <i class="fa-solid fa-folder text-xs"></i>
                            </div>
                            <div class="truncate">
                                <div class="text-xs font-bold text-warm-text truncate group-hover:text-khaki-700">${f.name}</div>
                                <div class="text-[10px] text-warm-muted">${itemCount} 項商品</div>
                            </div>
                        </div>
                        <div onclick="event.stopPropagation(); deleteFolder('${f.id}')" class="w-7 h-7 rounded-lg hover:bg-red-50 flex items-center justify-center text-warm-muted hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all">
                            <i class="fa-solid fa-trash text-[10px]"></i>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // 3. 商品表格渲染
        function renderItemTable() {
            const tbody = document.getElementById('item-table-body');
            let currentItems = items.filter(i => (i.folderId || null) === currentFolderId);

            if (searchQuery.trim() !== '') {
                currentItems = currentItems.filter(i => i.name.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            document.getElementById('item-count-label').innerText = `共 ${currentItems.length} 項商品`;

            if (currentItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-xs text-warm-muted">目前沒有商品記錄</td></tr>`;
                return;
            }

            let html = '';
            currentItems.forEach(item => {
                const isChecked = selectedItemIds.has(item.id);
                const bgStyle = item.bgColor && item.bgColor !== '#FFFFFF' ? `background-color: ${item.bgColor};` : '';
                const textStyle = `color: ${item.textColor || '#3A322C'}; font-weight: ${item.fontWeight || 'bold'};`;

                html += `
                    <tr class="hover:bg-khaki-50/30 transition-colors" style="${bgStyle}">
                        <td class="py-2.5 px-1 text-center">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSelectItem('${item.id}')" class="rounded text-khaki-600 focus:ring-khaki-500 w-4 h-4 border-warm-border">
                        </td>
                        <td class="py-2.5 px-1 text-center">
                            <div class="w-10 h-10 rounded-xl bg-warm-bg border border-warm-border overflow-hidden flex items-center justify-center mx-auto shadow-xs">
                                ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-image text-warm-muted text-xs"></i>`}
                            </div>
                        </td>
                        <td class="py-2.5 px-2 truncate">
                            <div class="text-xs truncate" style="${textStyle}">${item.name}</div>
                        </td>
                        <td class="py-2.5 px-1 text-center">
                            <div class="inline-flex items-center border border-warm-border rounded-xl bg-white overflow-hidden shadow-xs">
                                <button onclick="adjustQty('${item.id}', -1)" class="w-7 h-7 flex items-center justify-center text-warm-muted hover:bg-khaki-100 transition-colors text-xs font-bold">-</button>
                                <input type="number" value="${item.quantity}" onchange="updateQty('${item.id}', this.value)" class="w-8 text-center text-xs font-bold text-warm-text focus:outline-none">
                                <button onclick="adjustQty('${item.id}', 1)" class="w-7 h-7 flex items-center justify-center text-warm-muted hover:bg-khaki-100 transition-colors text-xs font-bold">+</button>
                            </div>
                        </td>
                        <td class="py-2.5 px-1 text-center">
                            <div class="flex items-center justify-center gap-1">
                                <button onclick="openMoveModalForItem('${item.id}')" class="w-7 h-7 rounded-lg hover:bg-khaki-100 flex items-center justify-center text-khaki-700 transition-colors" title="移動至...">
                                    <i class="fa-solid fa-folder-arrow-right text-xs"></i>
                                </button>
                                <button onclick="deleteItem('${item.id}')" class="w-7 h-7 rounded-lg hover:bg-red-50 flex items-center justify-center text-warm-muted hover:text-red-500 transition-colors" title="刪除">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // 搜尋功能
        function handleSearch(val) {
            searchQuery = val;
            renderItemTable();
        }

        // 數量增減
        function adjustQty(id, delta) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.quantity = Math.max(0, item.quantity + delta);
                saveData();
            }
        }

        function updateQty(id, val) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.quantity = Math.max(0, parseInt(val) || 0);
                saveData();
            }
        }

        // 勾選與批次操作
        function toggleSelectItem(id) {
            if (selectedItemIds.has(id)) {
                selectedItemIds.delete(id);
            } else {
                selectedItemIds.add(id);
            }
            updateBatchBar();
        }

        function toggleSelectAll(master) {
            const currentItems = items.filter(i => (i.folderId || null) === currentFolderId);
            if (master.checked) {
                currentItems.forEach(i => selectedItemIds.add(i.id));
            } else {
                selectedItemIds.clear();
            }
            renderItemTable();
            updateBatchBar();
        }

        function updateBatchBar() {
            const bar = document.getElementById('batch-bar');
            const countText = document.getElementById('batch-count-text');
            if (selectedItemIds.size > 0) {
                bar.classList.remove('hidden', 'translate-y-10', 'opacity-0');
                countText.innerText = `已選擇 ${selectedItemIds.size} 項`;
            } else {
                bar.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => bar.classList.add('hidden'), 200);
            }
        }

        // 資料夾管理 Modal
        function openFolderModal() {
            document.getElementById('edit-folder-id').value = '';
            document.getElementById('folder-name-input').value = '';
            document.getElementById('folder-modal-title').innerText = '新增資料夾';
            document.getElementById('folder-modal').classList.remove('hidden');
        }

        function closeFolderModal() {
            document.getElementById('folder-modal').classList.add('hidden');
        }

        function saveFolder() {
            const name = document.getElementById('folder-name-input').value.trim();
            if (!name) return alert('請輸入資料夾名稱');

            folders.push({
                id: 'f_' + Date.now(),
                name: name,
                parentId: currentFolderId
            });
            saveData();
            closeFolderModal();
        }

        function deleteFolder(id) {
            if (!confirm('確定要刪除此資料夾嗎？（其底下的子資料夾與商品將一併移除）')) return;
            
            function getDescendantFolderIds(folderId) {
                let ids = [folderId];
                folders.filter(f => f.parentId === folderId).forEach(sub => {
                    ids = ids.concat(getDescendantFolderIds(sub.id));
                });
                return ids;
            }

            const targetIds = getDescendantFolderIds(id);
            items = items.filter(i => !targetIds.includes(i.folderId));
            folders = folders.filter(f => !targetIds.includes(f.id));
            
            if (currentFolderId && targetIds.includes(currentFolderId)) {
                currentFolderId = null;
            }
            saveData();
        }

        // 商品管理 Modal
        function openItemModal() {
            document.getElementById('edit-item-id').value = '';
            document.getElementById('item-name-input').value = '';
            document.getElementById('item-qty-input').value = '1';
            document.getElementById('image-preview-box').innerHTML = `<i class="fa-solid fa-image text-lg"></i>`;
            document.getElementById('item-image-input').value = '';
            document.getElementById('item-font-weight').value = 'bold';
            document.getElementById('item-text-color').value = '#3A322C';
            document.getElementById('item-bg-color').value = '#FFFFFF';
            document.getElementById('item-modal-title').innerText = '新增商品';
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function closeItemModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        let uploadedImageBase64 = '';
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('image-preview-box').innerHTML = `<img src="${uploadedImageBase64}" class="w-full h-full object-cover">`;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveItem() {
            const name = document.getElementById('item-name-input').value.trim();
            const qty = parseInt(document.getElementById('item-qty-input').value) || 0;
            if (!name) return alert('請輸入商品名稱');

            items.push({
                id: 'i_' + Date.now(),
                name: name,
                quantity: qty,
                image: uploadedImageBase64 || '',
                folderId: currentFolderId,
                fontWeight: document.getElementById('item-font-weight').value,
                textColor: document.getElementById('item-text-color').value,
                bgColor: document.getElementById('item-bg-color').value
            });

            uploadedImageBase64 = '';
            saveData();
            closeItemModal();
        }

        function deleteItem(id) {
            if (!confirm('確定要刪除此商品嗎？')) return;
            items = items.filter(i => i.id !== id);
            selectedItemIds.delete(id);
            saveData();
        }

        function batchDeleteItems() {
            if (!confirm(`確定要刪除選中的 ${selectedItemIds.size} 項商品嗎？`)) return;
            items = items.filter(i => !selectedItemIds.has(i.id));
            selectedItemIds.clear();
            saveData();
        }

        // 移動商品至資料夾 Modal (具備字體放大與快速新增)
        function openMoveModalForItem(itemId) {
            targetItemForMove = { type: 'single', id: itemId };
            openMoveModal();
        }

        function openBatchMoveModal() {
            if (selectedItemIds.size === 0) return;
            targetItemForMove = { type: 'batch' };
            openMoveModal();
        }

        function openMoveModal() {
            renderMoveFolderTree();
            document.getElementById('move-modal').classList.remove('hidden');
        }

        function closeMoveModal() {
            document.getElementById('move-modal').classList.add('hidden');
            targetItemForMove = null;
        }

        function renderMoveFolderTree() {
            const container = document.getElementById('move-folder-tree');
            let html = `
                <div onclick="executeMove(null)" class="p-2 rounded-xl hover:bg-khaki-100 cursor-pointer flex items-center gap-2 text-khaki-900 font-bold">
                    <i class="fa-solid fa-house"></i> 主目錄 (Root)
                </div>
            `;

            function buildTree(parentId, depth) {
                const subs = folders.filter(f => f.parentId === parentId);
                subs.forEach(sub => {
                    let indent = '&nbsp;'.repeat(depth * 4) + '└─ ';
                    html += `
                        <div onclick="executeMove('${sub.id}')" class="p-2 rounded-xl hover:bg-khaki-100 cursor-pointer flex items-center gap-2 text-warm-text font-medium truncate">
                            <span class="text-warm-muted">${indent}</span>
                            <i class="fa-solid fa-folder text-khaki-600"></i> ${sub.name}
                        </div>
                    `;
                    buildTree(sub.id, depth + 1);
                });
            }
            buildTree(null, 1);
            container.innerHTML = html;
        }

        function quickCreateFolderInMove() {
            const nameInput = document.getElementById('quick-subfolder-name');
            const name = nameInput.value.trim();
            if (!name) return alert('請輸入新資料夾名稱');

            const newId = 'f_' + Date.now();
            folders.push({
                id: newId,
                name: name,
                parentId: currentFolderId
            });
            nameInput.value = '';
            saveData();
            renderMoveFolderTree();
        }

        function executeMove(targetFolderId) {
            if (!targetItemForMove) return;

            if (targetItemForMove.type === 'single') {
                const item = items.find(i => i.id === targetItemForMove.id);
                if (item) item.folderId = targetFolderId;
            } else if (targetItemForMove.type === 'batch') {
                items.forEach(i => {
                    if (selectedItemIds.has(i.id)) {
                        i.folderId = targetFolderId;
                    }
                });
                selectedItemIds.clear();
            }

            saveData();
            closeMoveModal();
        }

        // 雲端帳號登入模擬與狀態介面切換 (預留結構，可無縫串接 Firebase)
        function toggleCloudLoginModal() {
            const modal = document.getElementById('cloud-login-modal');
            modal.classList.toggle('hidden');
        }

        function loginWithGoogle() {
            // 此處為雲端登入預留介面，可連接 Firebase Auth
            alert('已模擬切換至雲端同步模式！您的本地資料已與雲端綁定。');
            document.getElementById('cloud-status-text').innerText = '已連線 (雲端)';
            document.getElementById('auth-user-info').classList.remove('hidden');
            document.getElementById('auth-user-email').innerText = 'my_inventory_user@google.com';
            document.getElementById('login-google-btn').classList.add('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('sync-indicator').classList.remove('hidden');
            toggleCloudLoginModal();
        }

        function logoutCloud() {
            document.getElementById('cloud-status-text').innerText = '訪客模式 (本機)';
            document.getElementById('auth-user-info').classList.add('hidden');
            document.getElementById('login-google-btn').classList.remove('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('sync-indicator').classList.add('hidden');
            toggleCloudLoginModal();
        }
    </script>
</body>
</html>
